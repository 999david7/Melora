name: macOS release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - name: Build app
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          MELORA_BUILD: ${{ github.run_number }}
        run: |
          export MELORA_VERSION="${RELEASE_TAG#v}"
          ./macOS/scripts/build-app.sh
          codesign --verify --deep --strict macOS/dist/Melora.app
          lipo -verify_arch '${{ matrix.architecture }}' macOS/dist/Melora.app/Contents/MacOS/Melora
      - name: Test native app
        run: ./macOS/scripts/test.sh
      - name: Package app
        run: |
          ditto -c -k --keepParent macOS/dist/Melora.app 'Melora-macos-${{ matrix.architecture }}.zip'
          ./macOS/scripts/create-dmg.sh "$PWD/Melora-macos-${{ matrix.architecture }}.dmg"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Melora-macos-${{ matrix.architecture }}
          path: |
            Melora-macos-${{ matrix.architecture }}.zip
            Melora-macos-${{ matrix.architecture }}.dmg
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: Melora-macos-*
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "Melora ${RELEASE_TAG#v}" --generate-notes --verify-tag --draft
          fi
          gh release upload "$RELEASE_TAG" Melora-macos-*.zip --clobber
          gh release upload "$RELEASE_TAG" Melora-macos-*.dmg --clobber
          gh release edit "$RELEASE_TAG" --draft=false
