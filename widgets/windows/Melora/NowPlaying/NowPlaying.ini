; Melora - Now Playing, a Rainmeter desktop widget for Windows.
; Shows what Melora is playing in your browser and controls it.
; Needs Rainmeter 4.5 or newer, and Melora running (start.bat).

[Rainmeter]
Update=1000
AccurateText=1
ContextTitle=Open Melora
ContextAction=["#Server#"]
ContextTitle2=Open mini player
ContextAction2=["#Server#/widget/"]

[Metadata]
Name=Melora Now Playing
Author=Melora
Information=Now playing and playback controls for Melora. Edit @Resources\Variables.inc if Melora uses a different port.
Version=1.0
License=MIT

@Include=#@#Variables.inc

; ------------------------------------------------------------------ measures

; One request a second to the plain-text endpoint: fixed key=value lines in
; this order, with display text already filled in for idle and locked states.
[MeasureNowPlaying]
Measure=WebParser
URL=#Server#/api/now-playing.txt
CodePage=65001
RegExp=(?siU)^state=(.*)\ntitle=(.*)\nartist=(.*)\nalbum=(.*)\nposition=(.*)\nduration=(.*)\nprogress=(.*)\nart=(.*)\nnext=(.*)\ncontrollable=(.*)\n
FinishAction=[!SetOption MeterCaption MeasureName MeasureState][!SetOption MeterTitle MeasureName MeasureTitle][!SetOption MeterArtist MeasureName MeasureArtist][!UpdateMeterGroup Widget][!Redraw]
OnConnectErrorAction=[!SetOption MeterCaption MeasureName ""][!SetOption MeterCaption Text "MELORA"][!SetOption MeterTitle MeasureName ""][!SetOption MeterTitle Text "Melora is not running"][!SetOption MeterArtist MeasureName ""][!SetOption MeterArtist Text "Start it with start.bat"][!UpdateMeterGroup Widget][!Redraw]

[MeasureState]
Measure=WebParser
URL=[MeasureNowPlaying]
StringIndex=1
Substitute="idle":"Melora","playing":"Now playing","paused":"Paused","locked":"Locked"
IfMatch=^Now playing$
IfMatchAction=[!ShowMeterGroup Pause][!HideMeterGroup Play][!Redraw]
IfNotMatchAction=[!ShowMeterGroup Play][!HideMeterGroup Pause][!Redraw]

[MeasureTitle]
Measure=WebParser
URL=[MeasureNowPlaying]
StringIndex=2

[MeasureArtist]
Measure=WebParser
URL=[MeasureNowPlaying]
StringIndex=3

[MeasurePosition]
Measure=WebParser
URL=[MeasureNowPlaying]
StringIndex=5

[MeasureDuration]
Measure=WebParser
URL=[MeasureNowPlaying]
StringIndex=6

[MeasureProgress]
Measure=WebParser
URL=[MeasureNowPlaying]
StringIndex=7
MinValue=0
MaxValue=1

[MeasureArtUrl]
Measure=WebParser
URL=[MeasureNowPlaying]
StringIndex=8
; Download the cover only when the song changes, not every second.
OnChangeAction=[!CommandMeasure MeasureArt "Update"]
IfMatch=^$
IfMatchAction=[!HideMeter MeterArt][!Redraw]

; The cover is a separate request whose URL comes from the line above.
[MeasureArt]
Measure=WebParser
URL=[&MeasureArtUrl]
DynamicVariables=1
UpdateRate=-1
Download=1
DownloadFile=cover.jpg
FinishAction=[!SetOption MeterArt ImageName "[MeasureArt]"][!ShowMeter MeterArt][!UpdateMeter MeterArt][!Redraw]
OnDownloadErrorAction=[!HideMeter MeterArt][!Redraw]

; Commands are POSTs sent with curl, which ships with Windows 10 and 11, run
; hidden. The X-Melora-Remote header is required: it is what stops a web page
; from pressing these buttons for you.
[MeasureCommand]
Measure=Plugin
Plugin=RunCommand
Parameter=curl.exe -s -X POST -H "X-Melora-Remote: 1" #Server#/api/remote/toggle
State=Hide
FinishAction=[!CommandMeasure MeasureNowPlaying "Update"]

; -------------------------------------------------------------------- meters

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,340,124,6 | Fill Color #Paper# | StrokeWidth 1 | Stroke Color #Rule#

; A blank record under the cover, showing through when there is none.
[MeterDisc]
Meter=Shape
X=12
Y=12
Shape=Rectangle 0,0,100,100,3 | Fill Color 242,242,240,255 | StrokeWidth 1 | Stroke Color #Rule#
Shape2=Ellipse 50,50,24 | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color 180,184,189,255
Shape3=Ellipse 50,50,6 | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color 180,184,189,255

[MeterArt]
Meter=Image
X=12
Y=12
W=100
H=100
PreserveAspectRatio=2
Hidden=1

[MeterCaption]
Meter=String
Text=MELORA
X=126
Y=14
FontFace=Consolas
FontSize=7
FontColor=#Muted#
StringCase=Upper
AntiAlias=1
Group=Widget

[MeterTitle]
Meter=String
Text=Connecting...
X=126
Y=30
W=200
H=18
ClipString=1
FontFace=Segoe UI Semibold
FontSize=10
FontColor=#Ink#
AntiAlias=1
Group=Widget

[MeterArtist]
Meter=String
X=126
Y=50
W=200
H=16
ClipString=1
FontFace=Segoe UI
FontSize=8.5
FontColor=#Muted#
AntiAlias=1
Group=Widget

[MeterProgressTrack]
Meter=Shape
X=126
Y=74
Shape=Rectangle 0,0,200,2 | Fill Color #Rule# | StrokeWidth 0

[MeterProgress]
Meter=Bar
MeasureName=MeasureProgress
X=126
Y=74
W=200
H=2
BarColor=#Ink#
BarOrientation=Horizontal
Group=Widget

[MeterPosition]
Meter=String
MeasureName=MeasurePosition
X=126
Y=82
FontFace=Consolas
FontSize=7
FontColor=#Muted#
AntiAlias=1
Group=Widget

[MeterDuration]
Meter=String
MeasureName=MeasureDuration
X=326
Y=82
StringAlign=Right
FontFace=Consolas
FontSize=7
FontColor=#Muted#
AntiAlias=1
Group=Widget

; Buttons: hairline circles with the same glyphs as the app.
[MeterPrevious]
Meter=Shape
X=183
Y=91
Shape=Ellipse 13,13,12.5 | Fill Color #Paper# | StrokeWidth 1 | Stroke Color #Rule#
Shape2=Path Glyph | Fill Color 0,0,0,0 | StrokeWidth 1.2 | Stroke Color #Ink# | StrokeLineJoin Round
Glyph=17,8.5 | LineTo 10.5,13 | LineTo 17,17.5 | ClosePath 1
Shape3=Line 9,8.5,9,17.5 | StrokeWidth 1.2 | Stroke Color #Ink# | StrokeStartCap Round | StrokeEndCap Round
LeftMouseUpAction=[!SetOption MeasureCommand Parameter "curl.exe -s -X POST -H ""X-Melora-Remote: 1"" #Server#/api/remote/previous"][!UpdateMeasure MeasureCommand][!CommandMeasure MeasureCommand "Run"]
ToolTipText=Previous

[MeterPlay]
Meter=Shape
X=213
Y=88
Shape=Ellipse 16,16,16 | Fill Color #Ink# | StrokeWidth 0
Shape2=Path Glyph | Fill Color #Paper# | StrokeWidth 0
Glyph=13,10 | LineTo 22,16 | LineTo 13,22 | ClosePath 1
Group=Play
LeftMouseUpAction=[!SetOption MeasureCommand Parameter "curl.exe -s -X POST -H ""X-Melora-Remote: 1"" #Server#/api/remote/toggle"][!UpdateMeasure MeasureCommand][!CommandMeasure MeasureCommand "Run"]
ToolTipText=Play

[MeterPause]
Meter=Shape
X=213
Y=88
Shape=Ellipse 16,16,16 | Fill Color #Ink# | StrokeWidth 0
Shape2=Line 13,11,13,21 | StrokeWidth 1.6 | Stroke Color #Paper# | StrokeStartCap Round | StrokeEndCap Round
Shape3=Line 19,11,19,21 | StrokeWidth 1.6 | Stroke Color #Paper# | StrokeStartCap Round | StrokeEndCap Round
Group=Pause
Hidden=1
LeftMouseUpAction=[!SetOption MeasureCommand Parameter "curl.exe -s -X POST -H ""X-Melora-Remote: 1"" #Server#/api/remote/toggle"][!UpdateMeasure MeasureCommand][!CommandMeasure MeasureCommand "Run"]
ToolTipText=Pause

[MeterNext]
Meter=Shape
X=251
Y=91
Shape=Ellipse 13,13,12.5 | Fill Color #Paper# | StrokeWidth 1 | Stroke Color #Rule#
Shape2=Path Glyph | Fill Color 0,0,0,0 | StrokeWidth 1.2 | Stroke Color #Ink# | StrokeLineJoin Round
Glyph=9,8.5 | LineTo 15.5,13 | LineTo 9,17.5 | ClosePath 1
Shape3=Line 17,8.5,17,17.5 | StrokeWidth 1.2 | Stroke Color #Ink# | StrokeStartCap Round | StrokeEndCap Round
LeftMouseUpAction=[!SetOption MeasureCommand Parameter "curl.exe -s -X POST -H ""X-Melora-Remote: 1"" #Server#/api/remote/next"][!UpdateMeasure MeasureCommand][!CommandMeasure MeasureCommand "Run"]
ToolTipText=Next
